    //所有信息点击事件
    function showAllInformat(){
        let allInformat=$("#allInformat")
        if (allInformat.attr("class")!="active"){
            allInformat.addClass("active");
            $("#analysis").removeClass("active");
            // $("#temAndHumAnalysis").removeClass("active");

        }

        $("#dataOne").show();
        $("#dataTwo").hide();
        // $("#dataThree").hide();

    }
    //统计分析点击事件
    function showAnalysis(){
        let analysis=$("#analysis")
        if (analysis.attr("class")!="active"){
            analysis.addClass("active");
            $("#allInformat").removeClass("active");
            // $("#temAndHumAnalysis").removeClass("active");

        }

        $("#dataOne").hide();
        $("#dataTwo").show();


    }
    //统计分析->电流统计点击事件
    function showElectric() {
        let electric=$("#electric")
        if(electric.attr("class")!="active"){
            electric.addClass("active")
            $("#TemAndHum").removeClass("active")
        }

        $("#eleInformation").show();
        $("#temAndHumInformation").hide();
    }
    //统计分析->温度湿度统计点击事件
    function showTemAndHum() {

        let temAndHum=$("#TemAndHum")
        if(temAndHum.attr("class")!="active"){
            temAndHum.addClass("active")
            $("#electric").removeClass("active")
        }

        $("#eleInformation").hide();
        $("#temAndHumInformation").show();
    }

    //统计分析->电流搜索事件
    function eleSearch() {
        var d = {};
        var t=$("#ele_config-form").serializeArray();
        $.each(t, function() {
            d[this.name] = this.value;
        });
        taskname=d.taskname

        beginTime=d.beginTime
        endTime=d.endTime


        $.ajax({
            url:"/listEleSearch",
            type:"POST",
            data:{
                taskname:taskname,
                beginTime:beginTime,
                endTime:endTime,
            },
            async:false,
            success:function (data) {
                // console.log(data)
                let xAxis=data.xAxis;
                let eleValue=data.eleValue;

                if(xAxis.length!=0&&(!jQuery.isEmptyObject(eleValue))){
                    // console.log("1")
                    //x轴

                    //曲线图的值
                    let series=[]
                    //现在只展示平均值
                    $.each(eleValue,function (key,value) {
                        var serie={
                            name:key,
                            data:value
                        }
                        series.push(serie)

                    })

                    var options = {
                        title: {
                            text: '电流曲线图'                 // 标题
                        },
                        xAxis: {
                            categories: xAxis   // x 轴分类
                        },
                        yAxis: {
                            title: {
                                text: '电流值'                // y 轴标题
                            }
                        },
                        // tooltip: {
                        //     //后缀
                        //     valueSuffix: ''
                        // },
                        legend : {
                            //图例
                            layout: 'vertical',
                            align: 'right',
                            verticalAlign: 'middle',
                            borderWidth: 0
                        },
                        credits: {
                            enabled : false
                        },
                        series:series

                    };

                    // 图表初始化函数
                    var chart = Highcharts.chart('container', options);

                }


            }
        })



    }

    //统计分析->温度湿度搜索事件
    function temAndHumSearch() {
        var d = {};
        var t=$("#temAndHum_config-form").serializeArray();
        $.each(t, function() {
            d[this.name] = this.value;
        });
        taskname=d.taskname

        beginTime=d.beginTime
        endTime=d.endTime

        $.ajax({
            url:"/listTemAndHumSearch",
            type:"POST",
            data:{
                taskname:taskname,
                beginTime:beginTime,
                endTime:endTime,
            },
            async:false,
            success:function (data) {
                let temxAxis=data.temxAxis;
                let temValue=data.temValue;
                let humxAxis=data.humxAxis;
                let humValue=data.humValue;

                //添加温度曲线图
                if(temxAxis.length!=0&&(!jQuery.isEmptyObject(temValue))){
                    // console.log("data")
                    let temContainer="<div id=\"temContainer\" class=\"col-md-6\" style=\"width: 600px;height:400px;\"></div>";
                    $("#temAndHumChart").append(temContainer);


                    let temSeries=[]
                    //现在只展示平均值
                    $.each(temValue,function (key,value) {
                        var serie={
                            name:key,
                            data:value
                        }
                        temSeries.push(serie)

                    })


                    var temChart = Highcharts.chart('temContainer', {
                        title: {
                            text: '温度曲线图'
                        },
                        xAxis: {
                            categories: temxAxis   // x 轴分类
                        },
                        yAxis: {
                            title: {
                                text: '温度值'
                            }
                        },

                            layout: 'vertical',
                            align: 'right',
                            verticalAlign: 'middle'
                        },

                            enabled : false

                    //现在只展示平均值

                        }
                        humSeries.push(serie)

                    })

                    var humChart = Highcharts.chart('humContainer', {
                        title: {
                            text: '湿度曲线图'
                        },
                        xAxis: {
                            categories: humxAxis   // x 轴分类
                        },
                        yAxis: {
                            title: {
                                text: '湿度值'
                            }
                        },
                        legend: {
                            layout: 'vertical',
                            align: 'right',
                            verticalAlign: 'middle'
                        },
                        credits: {
                            enabled : false
                        },
                        series: humSeries,
                        responsive: {
                            rules: [{
                                condition: {
                                    maxWidth: 500
                                },
                                chartOptions: {
                                    legend: {
                                        layout: 'horizontal',
                                        align: 'center',
                                        verticalAlign: 'bottom'
                                    }
                                }
                            }]
                        }
                    });


                }








            }
        })


    }

    //搜索触发函数
    function search(){
        var d = {};
        var t=$("#config-form").serializeArray();
        $.each(t, function() {
            d[this.name] = this.value;
        });
        // let data=JSON.stringify(d)
        // console.log(d)
        taskname=d.taskname
        instrument=d.instrument
        status=d.status
        beginTime=d.beginTime
        endTime=d.endTime
        if(new Date(beginTime)>new Date(endTime)){
            alert("开始时间必须小于等于结束时间")
            return;

        }
        // var tasks={};
        // tasks["703"]=""

        $.ajax({
            url:"/listPageLatestTableResult",
            type:"POST",
            data:{
                taskname:taskname,
                instrument:instrument,
                status:status,
                beginTime:beginTime,
                endTime:endTime,
                pageNum:1,
                pageSize:pageSize
            },
            async:false,
            success:function (data) {


                //总共数量
                totalSize=data.totalSize;
                //页码总数
                totalPages=data.totalPages;
                //当前页码
                pageNum=1;
                //所有记录
                let results=data.content;

                $("#pageLimit").empty();
                $("#pageBody").empty();


                $.each(results,function (i,d) {

                    let record_code=d.record_code;
                    let taskname=d.taskname;
                    let tablename=d.tablename;

    function getPage(tmpPageNum){
        // console.log(tmpPageNum)
        if(tmpPageNum>totalPages||tmpPageNum<=0){
            return;
        }

        pageNum=tmpPageNum;
        rebuildPage(pageNum)
        highLight()
        $.ajax({
            url:"/listPageLatestTableResult",
            type:"POST",
            data:{
                taskname:taskname,
                instrument:instrument,
                status:status,
                beginTime:beginTime,
                endTime:endTime,
                pageNum:pageNum,
                pageSize:pageSize
            },
            async:false,
            success:function (data) {
                let results=data.content;
                //清空数据
                $("#pageBody").empty();
                $.each(results,function (i,d) {
                    let record_code=d.record_code;
                    let taskname=d.taskname;
                    let tablename=d.tablename;
                    let result=d.result;
                    let ident_status=d.ident_status;
                    let ident_info=d.ident_info;
                    let ident_time=d.ident_time;

                        resultStatus="<td style=\"text-align: center; \">" + "<span class=\"badge badge-danger\">"+ident_status+"</span>" + "</td>"
                    }else if(ident_status=="异常"){
                        resultStatus="<td style=\"text-align: center; \">" + "<span class=\"badge badge-secondary\">"+ident_status+"</span>" + "</td>"
                    }else if(ident_status=="告警"){
                        resultStatus="<td style=\"text-align: center; \">" + "<span class=\"badge badge-warning\">"+ident_status+"</span>" + "</td>"
                    }else{
                        resultStatus="<td style=\"text-align: center; \">"  +ident_status + "</td>"
                    }


                    let content="<tr>"+
                        "<td style=\"text-align: center; \">"+((pageNum-1)*10+i+1).toString()+"</td>"+
                        "<td style=\"text-align: center; \">"+taskname+"</td>"+
                        "<td style=\"text-align: center; \">"+record_code+"</td>"+
                        "<td style=\"text-align: center; \">"+ident_time+"</td>"+
                        "<td style=\"text-align: center; \">"+tablename+"</td>"+
                        "<td style=\"text-align: center; \">"+result+"</td>"+
                        "<td style=\"text-align: center; \">"+ident_info+"</td>"+
                        resultStatus+
                        "<td style=\"text-align: center; \"><a class=\"btn btn-success btn-xs \" href=\"javascript:void(0)\" onclick=\"seePicture(this)\"><i class=\"fa fa-edit\"></i>查看图片</a></td>"+
                        "</tr>"

                    $("#pageBody").append(content)
                })
            }
        })

    $("#pageLimit").on("click",".ellipsis",function () {

        // alert(page)
        getPage(page)


    })

    $("#pageLimit").on("click",".pageNumber",function () {
        let page=$(this).data('id')


        // alert(page)
        getPage(page)


    })

    $("#pageLimit").on("click",".pagePreNext",function () {
        let preNext=$(this).data('id')
        if(preNext=="pre"){
            getPage(pageNum-1)

        }else{
            getPage(pageNum+1)
        }


    })

    function highLight() {
        $(".pageNumber").each(function () {
            if($(this).data('id')==pageNum){
                if(!$(this).parent().hasClass('active')){
                    $(this).parent().addClass('active').siblings().removeClass('active')
                }
            }
        })
    }




    function seePicture(obj) {
        let rowlists=$(obj).parent().siblings("td");
        let tasknameId=rowlists[1];
        let numberId=rowlists[2];
        let taskname=tasknameId.innerHTML;
        let number=numberId.innerHTML;

        let imgdata=number.substring(0,8);
        let imgtime=number.substring(8,12);

        let index=Number(number.substring(12))

        let imgPath="http://localhost:81/"+imgdata+"/"+imgtime+"/"+taskname+"/"+index.toString()+".jpg"
        $("#dialogImg").attr("src",imgPath)

        let isOpen=dialog.dialog("isOpen");
        if(isOpen==false){
            dialog.dialog("open");
        }
    }
