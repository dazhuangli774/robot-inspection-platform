<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <title>新建任务</title>
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link th:href="@{favicon.ico}" rel="stylesheet"/>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/jquery.contextMenu.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/animate.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link th:href="@{/css/skins.css}" rel="stylesheet"/>
    <link th:href="@{/yuludev/css/yuludev-ui.css}" rel="stylesheet"/>
</head>
<div class="wrapper wrapper-content animated fadeInRight">
    <!--th:action="@{insertPlan}"-->
    <form class="form-horizontal m"  id="addform" >
        <div class="form-group">
            <label class="col-sm-3 control-label">任务名称：</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="taskname" id="taskname">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">任务描述：</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="taskdes" id="taskdes">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">巡检节点：</label>
            <div class="col-sm-8" id="taskCategory">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <!--onclick="addPlan()"-->
                <button type="button" class="btn btn-sm btn-primary" onclick="addTask()"><i class="fa fa-check"></i>保 存</button>&nbsp;
                <a class="btn btn-sm btn-danger" th:href="@{/page/taskPage}" ><i class="fa fa-reply-all"></i>关 闭</a>
            </div>
        </div>
    </form>
</div>

<!-- 全局js -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script th:src="@{/js/plugins/slimscroll/jquery.slimscroll.min.js}"></script>
<script th:src="@{/js/jquery.contextMenu.min.js}"></script>
<script th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script th:src="@{/yuludev/js/yuludev-ui.js?v=4.2.0}"></script>
<script th:src="@{/yuludev/js/common.js?v=4.2.0}"></script>
<script th:src="@{/yuludev/index.js}"></script>
<script th:src="@{/ajax/libs/fullscreen/jquery.fullscreen.js}"></script>
<script>
    $(function(){
        $.ajax({
            type:"POST",
            url:"/page/listAllDevice",
            async:false,
            success:function(data){
                $.each(data,function(i,v){
                    let id=v.deviceId;
                    let instname=v.deviceName;
                    // let instarm=v.instarm;
                    // let instcategory=v.instcategory;
                    let instmarker=v.deviceMarkerName;
                    let content="";
                    content+=
                    "<label class=\"checkbox-inline\">"+
                    "<input type=\"checkbox\" id=\""+id+
                    "\" value=\""+instmarker+"\">"+instname+"</label>";
                    $("#taskCategory").append(content);
                })
            }
        })
    })

    function addTask(){
    let taskName=$("#taskname").val();
    let taskDes=$("#taskdes").val();
    let taskCategorys="";
    
    let formData = new FormData()
    $("input:checkbox:checked").each(function(){
        taskCategorys+=$(this).val()+",";    
    })
    taskCategorys=taskCategorys.substring(0,taskCategorys.length-1);
    formData.append('taskName',taskName)
    formData.append('taskDes',taskDes)
    formData.append('taskTarget',taskCategorys)

    $.ajax({
        type:"POST",
        url:"/page/insertTask",
        contentType:false,
        processData: false, // 上传进度
        cache: false,
        data:formData,
        success: function (data){
            window.location.href = '/page/taskPage'
            // alert(data)
        }
    })
}


</script>
</html>
