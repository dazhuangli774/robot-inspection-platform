server:
  port: 8081
spring:
  application:
    # 应用名称，会在注册中心中显示
    name: user
  cloud:
    nacos:
      discovery:
        # 注册中心地址
        server-addr: 127.0.0.1:8848
      config:
        #配置中心地址。
        server-addr: ${spring.cloud.nacos.discovery.server-addr}

  datasource:
    url: jdbc:mysql://localhost:3306/ricp?createDatabaseIfNotExist=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: mysql


# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5



# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

# Shiro
shiro:
  user:
    # 登录地址
    loginUrl: /register
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: true
    # 验证码类型 math 数组计算 char 字符
    captchaType: char
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain:
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    expireTime: 30
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# minio配置
minio:
  endpoint: http://127.0.0.1:9000
  bucket: web #存储桶名称
  access: admin #访问的key
  secret: Linjiegege2020 #访问的秘钥
## 支付宝配置
# 应用ID
alipay:
  appId: 把你的应用id填到这里
  # 应用私钥
  privateKey: 把你的应用私钥填到这里
  # 支付宝公钥，注意不是生成的应用公钥
  publicKey: 把你的支付宝公钥填到这里
  #支付网关配置，这一项是写死的，正式环境是openapi.alipay.com
  gateway: openapi.alipaydev.com
  # 支付宝前台跳转地址
  returnUrl: 生成的外网穿透链接/return_url.html
  # 支付宝后台通知地址
  notifyUrl: 生成的外网穿透链接/api/alipay/notify_url
  # 支付宝前台手机网页支付中途取消跳转地址
  errorUrl: 生成的外网穿透链接/error_url.html