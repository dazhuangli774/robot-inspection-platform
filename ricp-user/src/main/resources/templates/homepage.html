<script>

    $.fn.textScroll=function(){
        var p = $(this),  c = p.children(), speed=3000; //值越大速度越小
        var cw = c.width(),pw=p.width();
        var t = (cw / 100) * speed;
        var f = null, t1 = 0;
        function ani(tm) {
            counttime();
            c.animate({ left: -cw }, tm, "linear", function () {  c.css({ left: pw });  clearInterval(f);  t1 = 0;  t=((cw+pw)/100)*speed;  ani(t);
            });
        }
        function counttime() {
            f = setInterval(function () {
                t1 += 10;  }, 10);
        }
        p.on({  mouseenter: function () {
                c.stop(false, false);
                clearInterval(f);
                // console.log(t1);
            },  mouseleave: function () {
                ani(t - t1);
                // console.log(t1);
            }  });
        ani(t);  }

        if (equipment.attr("class")!="active"){

            $("#electric").removeClass("active");
        }

                        }else if(ident_status=="异常"){

                        }

                            "<tr>"+
                            "<td>"+(contentLength+1).toString()+"</td>"+
                            "<td>"+taskname+"</td>"+
                            "<td>"+ident_time+"</td>"+
                            "<td>"+tablename+"</td>"+
                            "<td>"+result+"</td>"+
                            "<td>"+ident_info+"</td>"+
                            resultStatus+
                            "</tr>"
                        $("#instInfo").append(content);

                        //
                        if(tablename=='温度'){
                            tem.push(Number(result))
                        }
                        if(tablename=='湿度'){
                            hum.push(Number(result))
                        }


                        //报警信息显示
                        if(ident_status=="报警"){

                            let dialogOldLength=$("#dialogInfo").find("tr").length;
                            let serialNum="<td>"+(dialogOldLength+1).toString()+"</td>";
                            let dialogContent=
                                "<tr>"+
                                serialNum+
                                "<td>"+taskname+"</td>"+
                                "<td>"+ident_time+"</td>"+
                                "<td>"+tablename+"</td>"+
                                "<td>"+result+"</td>"+
                                "<td>"+ident_info+"</td>"+
                                "<td style=\"text-align: left; \">" + "<span class=\"badge badge-danger\">报警</span>" + "</td>"+
                                "</tr>"
                            $("#dialogInfo").append(dialogContent);

                            dialogOldLength=$("#equipmentInfo").find("tr").length;
                            serialNum="<td>"+(dialogOldLength+1).toString()+"</td>";
                            dialogContent=
                                "<tr>"+
                                serialNum+
                                "<td>"+taskname+"</td>"+
                                "<td>"+ident_time+"</td>"+
                                "<td>"+tablename+"</td>"+
                                "<td>"+result+"</td>"+
                                "<td>"+ident_info+"</td>"+
                                "<td style=\"text-align: left; \">" + "<span class=\"badge badge-danger\">报警</span>" + "</td>"+
                                "</tr>"

                            $("#equipmentInfo").append(dialogContent);

                            isOpen=dialog.dialog("isOpen");
                            if(isOpen==false){
                                dialog.dialog("open");
                            }

                            //播放报警提示音
                            playMusic();


                        }
                        else if(ident_status=="告警"){
                            let systemLength=$("#systemInfo").find("tr").length;
                            let serialNum="<td>"+(systemLength+1).toString()+"</td>";
                            let systemContent=
                                "<tr>"+
                                serialNum+
                                "<td>"+taskname+"</td>"+
                                "<td>"+ident_time+"</td>"+
                                "<td>"+tablename+"</td>"+
                                "<td>"+result+"</td>"+
                                "<td>"+ident_info+"</td>"+
                                "<td style=\"text-align: left; \">" + "<span class=\"badge badge-warning\">告警</span>" + "</td>"+
                                "</tr>"
                            $("#systemInfo").append(systemContent);
                        }



                        //添加电流值显示

                        // if(ident_info=="三相电流值"){
                        //     let ele=ident_info.split(",");
                        //     ele = $.map(ele, function(s){ return parseFloat(s); });
                        //
                        //     let ave=(ele[0]+ele[1]+ele[2])/3
                        //
                        //     let eletmp={
                        //         name:taskname,
                        //         data:ele
                        //     }
                        //     //将电流值添加到曲线图中
                        //     eleValue.push(eletmp)
                        //
                        //     let eleRow="<tr>"+
                        //
                        //         "<td>"+taskname+"</td>"+
                        //         "<td>"+ident_time+"</td>"+
                        //         "<td>"+str(ele[0])+"</td>"+
                        //         "<td>"+str(ele[1])+"</td>"+
                        //         "<td>"+str(ele[2])+"</td>"+
                        //         "<td>"+str(ave)+"</td>"+
                        //         "</tr>"
                        //     $("#electricInfo").append(eleRow);
                        // }






                    })

                    //添加温度湿度平均值
                    let temAve=0
                    let humAve=0
                    if(tem.length!=0){
                        $.each(tem,function (i,d) {
                            temAve+=d/tem.length;
                        })
                    }
                    if(hum.length!=0){
                        $.each(hum,function (i,d) {
                            humAve+=d/tem.length;
                        })
                    }

                    var temAndHumAve=$("#noticeList")
                    temAndHumAve.empty();
                    let temAndHumContent="<span>温度平均值:"+temAve.toString()+" | 湿度平均值:"+humAve.toString()+"</span>";
                    temAndHumAve.append(temAndHumContent);
                    // $("#aaa").textScroll();

                    //添加电流曲线图配置

    function getRobotXAndY(){
        $.ajax({
            type:"GET",
            async:false,
            url:"http://127.0.0.1/api/robot_status",
            success:function(data){

                let dataJson=JSON.parse(data)

                let results=dataJson.results;
                let current_pose=results.current_pose;


                let x=current_pose.x;
                let y=current_pose.y;
                let tmpX=parseFloat(x)-(-8.37485)
                let tmpY=parseFloat(y)-(-17.1364)
                let newX=tmpX<0?(258+Math.abs(tmpX*50)):(258-Math.abs(tmpX*50));
                let newY=tmpX<0?(45+Math.abs(tmpY*50)):(45-Math.abs(tmpY*50));
                $("#robot").css({
                    'top':newY.toString()+'px',
                    'right':newX.toString()+'px'
                })
            }
        })
    }
