<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <title>巡检记录</title>
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link th:href="@{favicon.ico}" rel="stylesheet"/>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/jquery.contextMenu.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/animate.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link th:href="@{/css/skins.css}" rel="stylesheet"/>
    <link th:href="@{/yuludev/css/yuludev-ui.css?v=4.2.0}" rel="stylesheet"/>
</head>
<body class="full-height-layout gray-bg" style="overflow-x: hidden">
<!--<div style="position: absolute">-->

<!--</div>-->
<div>
    <div style="float:left;width:50%;overflow: auto;">
        <div form-group>
            <div class="col-sm-12" th:fragment="table_refresh" id="table_refresh">
                <table class="table table-striped table-sm " align="center">
                    <thead>
                    <tr>
                        <th>计划名称</th>
                        <th>计划描述</th>
                        <th>执行时间</th>
                        <th>操作员</th>
                        <th>计划状态</th>
                        <th>任务详情</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plans:${plans}">
                        <td >
                            <!--th:text="${plans.title}"-->
                            <span class="planname" th:text="${plans.title}"/>
                        </td>
                        <td >
                            <!--th:text="${plans.title}"-->
                            <span class="plandes" th:text="${plans.title}"/>
                        </td>
                        <td >
                            <span th:text="${#dates.format(plans.starttime,'yyyy-MM-dd HH:mm:ss')}"/>
                        </td>
                        <td >
                            <span th:text="${plans.username}"/>
                        </td>
                        <td>
                            <span th:text="${plans.status}"/>
                        </td>
                        <td>
                            <span th:text="${plans.taskid}"/>
                        </td>
                        <td>
                            <!--th:href="@{editTask(id=${task.id})}"-->
                            <a  class="btn btn-sm btn-warning create-logo">详情</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
