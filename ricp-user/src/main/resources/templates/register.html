<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>注册账号--巡检机器人管理系统</title>
    <meta name="description" content="机器人在线巡检系统">
    <link href="../static/css/main/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.css" th:href="@{/css/style.css}" rel="stylesheet"/>
    <link href="../static/css/login.css" th:href="@{/css/login.css}" rel="stylesheet"/>
    <link href="../static/yuludev/css/yuludev-ui.css" th:href="@{/yuludev/css/yuludev-ui.css?v=4.2.1}" rel="stylesheet"/>
    <!-- 360浏览器急速模式 -->
    <meta name="renderer" content="webkit">
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}"/>
    <style type="text/css">label.error { position:inherit;  }</style>
</head>
<body class="signin">
<div class="signinpanel">
    <div class="row">
        <div class="col-sm-6 col-md-6 col-lg-6 col-sm-offset-3 col-md-offset-3 col-lg-offset-3">
            <form id="registerForm" autocomplete="off">
                <div align="center">
                    <a href="http://www.liuzhousteel.com/">
                        <img class="mb-4" th:src="@{/img/logo.png}" alt="" width="198" height="49">
                    </a>
                </div>
                <h4>欢迎使用 <strong>巡检机器人管理系统</strong></h4>
                <strong>已经注册过? <a th:href="@{/user/login}">直接登录</a></strong>
                <h4 class="no-margins">注册：</h4>
                <p class="m-t-md"></p>
                <input type="text"     name="username" class="form-control uname"         placeholder="用户名"   maxlength="20" />
                <input type="password" name="password" class="form-control pword"         placeholder="密码"     maxlength="20" />
                <input type="password" name="confirmPassword" class="form-control pword"  placeholder="确认密码" maxlength="20" />

                <div class="checkbox-custom" th:classappend="${captchaEnabled==false} ? 'm-t'">
                    <input type="checkbox" id="acceptTerm" name="acceptTerm"> <label for="acceptTerm">我已阅读并同意</label>
                    <a href="https://www.baidu.com" target="_blank">使用条款</a>
                </div>
                <button class="btn btn-success btn-block" id="btnSubmit" data-loading="正在验证注册，请稍后...">注册</button>

            </form>
        </div>
    </div>
</div>
<script th:inline="javascript"> var ctx = [[@{/}]]; var captchaType = [[${captchaType}]]; </script>
<!-- 全局js -->
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script src="../static/js/bootstrap.min.js" th:src="@{/js/bootstrap.min.js}"></script>
<!-- 验证插件 -->
<script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
<script src="../static/ajax/libs/validate/messages_zh.min.js" th:src="@{/ajax/libs/validate/messages_zh.min.js}"></script>
<script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script src="../static/yuludev/js/yuludev-ui.js" th:src="@{/yuludev/js/yuludev-ui.js?v=4.2.0}"></script>
<script src="../static/yuludev/register.js" th:src="@{/yuludev/register.js}"></script>


</body>
</html>
