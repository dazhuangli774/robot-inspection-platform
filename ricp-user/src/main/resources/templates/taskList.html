<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <title>巡检计划管理</title>
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link th:href="@{favicon.ico}" rel="stylesheet"/>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/jquery.contextMenu.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/animate.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link th:href="@{/css/skins.css}" rel="stylesheet"/>
    <link th:href="@{/yuludev/css/yuludev-ui.css?v=4.2.0}" rel="stylesheet"/>
</head>
<body class="full-height-layout gray-bg" style="overflow-x: hidden">

<div form-group>
    <div class="form-group">
        <div class="col-sm-2 control-label">
            <a th:href="@{/page/addTaskPage}" class="btn btn-info">新建任务</a>
        </div>
    </div>
    <div class="col-sm-12" th:fragment="table_refresh" id="table_refresh">
<!--        <button type="button" class="btn btn-default" th:href="@{addPlan}">新建任务</button>-->

        <table class="table table-striped table-sm " align="center">
            <thead>
            <tr>
                <th>任务名称</th>
                <th>任务描述</th>
                <th>任务目标</th>
                <th>操作员</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task:${tasks}">
                <td >
                    <span th:text="${task.taskName}"/>
                </td>
                <td >
                    <span th:text="${task.taskDes}"/>
                </td>
                <td >
                    <span class="tasktype" th:text="${task.taskTarget}"/>
                </td>
                <td >
                    <span th:text="${task.createBy}"/>
                </td>
                <td>
                    <span th:text="${task.createTime}"/>
                </td>
                <td>
                    <a th:href="@{'/page/editTask?taskId='+${task.taskId}}" class="btn btn-sm btn-warning create-logo">修改</a>
                    <a th:href="@{'/page/deleteTask?taskId='+${task.taskId}}" class="btn btn-sm btn-danger del-logo" onclick="var toDelete = (confirm('确定删除此任务？')); return toDelete ">删除</a>
                    <a class="btn btn-sm btn-primary " onclick="robotMove(this)">立即执行</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- 全局js -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script th:src="@{/js/plugins/slimscroll/jquery.slimscroll.min.js}"></script>
<script th:src="@{/js/jquery.contextMenu.min.js}"></script>
<script th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script th:src="@{/ajax/libs/fullscreen/jquery.fullscreen.js}"></script>
<script th:src="@{/robot/js/planlist.js}"></script>

</body>
</html>
